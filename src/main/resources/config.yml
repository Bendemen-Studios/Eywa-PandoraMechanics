# Values can be overridden in each MythicMobs skill mechanic line.
predator-alarm:
  default-radius: 24.0
  default-cooldown-seconds: 5.0
  default-sound: ENTITY_WOLF_GROWL
prey-panic:
  default-radius: 16.0
  default-speed: 0.8
  default-cooldown-seconds: 1.5
territorial-warning:
  default-radius: 12.0
  default-cooldown-seconds: 6.0
  default-message: "&6You are too close to %mob%'s territory! Leave now!"
